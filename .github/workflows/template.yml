# Template-only: proves scripts/init-project.sh still produces a building project.
# scripts/init-project.sh deletes this file in repos created from the template.
name: Template

on:
  push:
  workflow_dispatch:

concurrency:
  group: template-${{ github.ref }}
  cancel-in-progress: true

jobs:
  init-project:
    name: Init project from template, then verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Run init-project
        run: ./scripts/init-project.sh com.acme.sample "Sample App"

      - name: Check nothing still references the template
        run: |
          if grep -rnF --exclude-dir=.git -e com.example.app -e com/example/app -e template-only .; then
            echo "init-project left template references behind" >&2
            exit 1
          fi
          test ! -e scripts/init-project.sh
          test ! -e .github/workflows/template.yml

      - name: Verify
        run: ./scripts/verify.sh

name: CI

on:
  # Every pushed branch gets CI + an installable APK, so agents get feedback before a PR exists.
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, unit test, build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Verify
        run: ./scripts/verify.sh

      - name: Name the APK artifact
        id: apk
        run: echo "name=$(basename app/build/dist/*.apk .apk)" >> "$GITHUB_OUTPUT"

      - name: Upload APK (install this on your phone)
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.apk.outputs.name }}
          path: app/build/dist/*.apk
          retention-days: 14

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/

  bundle:
    name: Release bundle (Play)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: verify
    env:
      # Set up once per docs/release.md. Without them the bundle is still built (to catch R8
      # problems in the release build) but left unsigned and not uploaded.
      KEYSTORE_BASE64: ${{ secrets.UNZIP_UPLOAD_KEYSTORE_BASE64 }}
      UNZIP_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UNZIP_UPLOAD_KEYSTORE_PASSWORD }}
      UNZIP_UPLOAD_KEY_ALIAS: ${{ secrets.UNZIP_UPLOAD_KEY_ALIAS }}
      UNZIP_UPLOAD_KEY_PASSWORD: ${{ secrets.UNZIP_UPLOAD_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Restore upload key
        id: key
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "UNZIP_UPLOAD_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build release bundle
        run: ./gradlew --no-daemon distReleaseBundle

      - name: Name the bundle artifact
        id: aab
        if: steps.key.outcome == 'success'
        run: echo "name=$(basename app/build/dist/*.aab .aab)-play" >> "$GITHUB_OUTPUT"

      - name: Upload bundle (upload this to Google Play)
        if: steps.key.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.aab.outputs.name }}
          path: app/build/dist/*.aab
          retention-days: 30

  version:
    name: Version bumped
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Merges to main carry the bump already; this guards branches before they merge.
    if: github.ref != 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check versionCode and versionName were raised
        run: ./scripts/check-version-bump.sh origin/main

  instrumented:
    name: Compose UI tests (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: verify
    steps:
      # The emulator needs ~7 GB for its userdata partition; hosted runners start with ~4 GB free.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: aosp_atd # Automated Test Device image: headless, boots fast in CI
          channel: canary # ATD images ship on the canary channel
          disk-size: 2048M # default userdata size doesn't fit on the runner; tests need very little
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          emulator-boot-timeout: 900
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest

      - name: Upload UI test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-reports
          path: app/build/reports/androidTests/
